name: Build Windows 7 app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Python 3.8 is the last Python that runs on Windows 7; x86 = 32-bit build.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build AttendanceFixer.exe
        run: |
          python -m pip install pyinstaller==5.13.2
          pyinstaller --onefile --windowed --name AttendanceFixer run_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceFixer-win7-32bit
          path: dist/AttendanceFixer.exe
